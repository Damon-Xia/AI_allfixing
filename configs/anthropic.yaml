# AI AllFixing - Anthropic Configuration
# Copy this to ~/.ai-allfixing/config.yaml

provider:
  name: anthropic
  api_key: ""  # Set via ANTHROPIC_API_KEY env var or here
  model: claude-sonnet-4-20250514
  base_url: null
  max_tokens: 4096
  temperature: 0.1
  extra: {}

log_level: INFO
cache_enabled: true
cache_dir: ~/.ai-allfixing/cache
output_format: text
